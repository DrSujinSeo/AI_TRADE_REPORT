name: Daily Auto Update ESG Report

on:
  schedule:
    # 매일 오전 8시 한국시간 (전날 23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: write

# The legacy manual entry points reuse this workflow and the same lock.
concurrency:
  group: ${{ github.repository }}-report-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Generate HTML Report
        run: python scripts/generate_html.py

      - name: Validate report
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ReportParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sections = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "section" and attrs.get("id", "").startswith("section-"):
                      self.sections.add(attrs["id"])

          report = Path("index.html").read_text(encoding="utf-8")
          parser = ReportParser()
          parser.feed(report)
          if len(parser.sections) != 12 or "</html>" not in report:
              raise SystemExit("Generated report is incomplete")
          print(f"Validated {len(parser.sections)} report sections")
          PY

      - name: Commit and push report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Stage only the published report, never caches or intermediate files.
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Report is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M:%S %Z') - Daily report"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin main
            fi
          done
          echo "::error::Could not push the report after three attempts."
          exit 1

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: esg-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: index.html
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Report update completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated and validated all 12 report sections." >> "$GITHUB_STEP_SUMMARY"
